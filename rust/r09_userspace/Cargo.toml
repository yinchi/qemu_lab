[package]
name = "r09_userspace"
version = "0.1.0"
edition = "2024"

[dependencies]
aarch64-cpu = "11.2.0"
aarch64-paging = "0.12.1"
arm-gic = "0.9.1"
embedded-io = { version = "0.7.1", default-features = false }
fdt = "0.1.5"
hadris-fat = { version = "2.4.0", default-features = false, features = ["alloc", "lfn", "read", "write", "sync"] }
linked_list_allocator = "0.10.6"
virtio-drivers = "0.13.0"

[build-dependencies]
cc = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
