# The programs Stage 15 changes: `date` now prints in a time zone. A tier of its own, as the scheme in
# `../progs_r12/Cargo.toml` describes (a stage `rNN` builds the base tier and every `progs_rMM` with
# MM <= NN, highest tier wins a name). The full IANA time-zone database is built into `date` by
# `chrono-tz`, which takes the binary to about 1.3 MB -- past what a program could be before this stage.
[package]
name = "progs_r15"
version = "0.1.0"
edition = "2024"

[dependencies]
abi = { path = "../abi" }
userlib = { path = "../userlib" }
progs = { path = "../progs" }
progs_r12 = { path = "../progs_r12" }
# Calendar dates and `strftime`. `alloc` is the feature that enables formatting; see `src/bin/date.rs`.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# chrono's formatting needs `alloc`, so this program needs a heap. Programs have none until Stage 16 (`brk`,
# and a growable heap in `userlib`), so `date` carries a small fixed one, from the crate the kernel's heap uses.
linked_list_allocator = "0.10.6"
# The whole IANA database (about 1 MB of data in the binary; the loader's ceiling grew for it, Stage 15).
chrono-tz = { version = "0.10", default-features = false }
getargs = { version = "0.5", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
