# The pure logic behind Stage 20's editor, `edit`, plus (from Step 5) `edit` itself
# (`src/bin/edit.rs`) -- a tier of its own, as the scheme in `../progs_r12/Cargo.toml` describes.
[package]
name = "progs_r20"
version = "0.1.0"
edition = "2024"

[dependencies]
# The exact glyph widths the console renders with (`r20_editor/src/console/font.rs`'s own
# dependency) -- so the editor's line-wrapping agrees with what `CONSOLE_DRAW` will actually put
# on screen, not an independent guess.
unifont = "1.1"
abi = { path = "../abi" }
userlib = { path = "../userlib", features = ["heap"] }
progs = { path = "../progs" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
