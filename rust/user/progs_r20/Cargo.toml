# The pure logic behind Stage 20's editor, `edit` -- a tier of its own, as the scheme in
# `../progs_r12/Cargo.toml` describes. `edit` itself (`src/bin/edit.rs`) arrives in Step 5, along
# with `abi`/`userlib`/`progs` as dependencies; this crate's modules exist beforehand, with none of
# those three, so they can be host-tested (`../../../r20_editor/hosttests`) the way the kernel's own
# pure modules are, and so no syscall or userlib dependency creeps into logic that has no business
# needing one.
[package]
name = "progs_r20"
version = "0.1.0"
edition = "2024"

[dependencies]
# The exact glyph widths the console renders with (`r20_editor/src/console/font.rs`'s own
# dependency) -- so the editor's line-wrapping agrees with what `CONSOLE_DRAW` will actually put
# on screen, not an independent guess.
unifont = "1.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
